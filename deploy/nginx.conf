# nginx server block for swarup.rasatech.in (Swarup Jewellers storefront + admin).
# A NEW file; no other site's configuration is touched.

upstream swarup_jewellers_app {
    server 127.0.0.1:3130;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name swarup.rasatech.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name swarup.rasatech.in;

    ssl_certificate     /etc/letsencrypt/live/swarup.rasatech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swarup.rasatech.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:swarup_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Admin photo uploads go one photo per request, 15 MB max each.
    client_max_body_size 20m;

    access_log /var/log/nginx/swarup.rasatech.in.access.log;
    error_log  /var/log/nginx/swarup.rasatech.in.error.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Product photos straight from disk; file names are content-unique, so cache them for a year.
    location ^~ /uploads/ {
        alias /var/www/swarup-jewellers/shared/uploads/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /_next/static/ {
        alias /var/www/swarup-jewellers/current/.next/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://swarup_jewellers_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
